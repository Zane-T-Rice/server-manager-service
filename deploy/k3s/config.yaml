# /etc/rancher/k3s/config.yaml on the control-plane desktop.
# Servers and the registry publish their ports on the node they run on (hostPort), like `docker run -p`, so the same
# number can be used on different nodes. Do not give a server a port that a host service already listens on
# (22, 6443, 10250, ...): the pod cannot start.
write-kubeconfig-mode: "0600"
# Uncomment if the desktops are not on one private network (needs UDP 51820 between them).
# flannel-backend: wireguard-native
