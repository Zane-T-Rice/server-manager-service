# Starts the service the first time. After that it updates itself through its own Server record,
# which replaces this Deployment (same name), so SERVER_ID must be that record's id.
# Render with: SERVER_ID=... NODE_NAME=... IMAGE=... DB_DIR=... envsubst < deploy/bootstrap/service.yaml | kubectl apply -f -
# The environment comes from the secret server-manager-bootstrap-env: see deploy/README.md section 3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-${SERVER_ID}
  namespace: server-manager-workloads
  labels:
    app.kubernetes.io/managed-by: server-manager
    server-manager/server-id: ${SERVER_ID}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: server-manager
      server-manager/server-id: ${SERVER_ID}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: server-manager
        server-manager/server-id: ${SERVER_ID}
    spec:
      serviceAccountName: server-manager
      nodeSelector:
        kubernetes.io/hostname: ${NODE_NAME}
      containers:
        - name: server
          image: ${IMAGE}
          envFrom:
            - secretRef: { name: server-manager-bootstrap-env }
          ports:
            - containerPort: 3000
              hostPort: 3000
          volumeMounts:
            - name: db
              mountPath: /server-manager-service/prisma/db
      volumes:
        - name: db
          hostPath:
            path: ${DB_DIR}
            type: Directory
