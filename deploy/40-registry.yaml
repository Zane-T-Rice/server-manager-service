# A plain http registry on the control-plane node. Build jobs push to it and every node pulls from it.
# Each node's containerd must be told to trust it: see deploy/k3s/registries.yaml.
# Its images live in a host directory, so it is pinned to a control-plane node (k3s labels server nodes; with more than one,
# label the node you want and change this selector).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: server-manager-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              hostPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          hostPath:
            path: /var/lib/server-manager-registry
            type: DirectoryOrCreate
