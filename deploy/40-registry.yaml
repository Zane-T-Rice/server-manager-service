# A plain http registry on the control-plane node. Build jobs push to it and every node pulls from it.
# Each node's containerd must be told to trust it: see deploy/k3s/registries.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: server-manager-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          hostPath:
            path: /var/lib/server-manager-registry
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: server-manager-system
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 5000
