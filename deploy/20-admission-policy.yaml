# Enforced by the API server, so it holds even if the service is compromised or a user
# configures a hostile server. Game servers often run as root and write to host
# directories, so this is not the "restricted" Pod Security profile; it blocks the
# things that turn a container into host root instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-manager-policy
  namespace: server-manager-workloads
data:
  # Comma separated host directories that servers may bind mount (the directory and anything below it).
  # Put the data of every new server under /home/zane/servers (created, owned by zane, on each node by the NixOS config) and
  # nothing here needs to change. The other entries are where existing servers already keep their data;
  # remove each one once that server's data has moved under /home/zane/servers.
  #   - /home/zane/valheim, palworld, abioticfactor, eyedivinecybermancy, certs: game servers on server-1
  #   - /home/zane/mount/NFS: Anime, Track, Remarkable and the service database
  #   - /var/lib/jellyfin, /var/cache/jellyfin, /home/zane/Nix/hosting: jellyfin on server-2
  allowedHostPaths: /home/zane/servers,/home/zane/valheim,/home/zane/palworld,/home/zane/abioticfactor,/home/zane/eyedivinecybermancy,/home/zane/certs,/home/zane/mount/NFS,/var/lib/jellyfin,/var/cache/jellyfin,/home/zane/Nix/hosting
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: server-manager-pods
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: Privileged containers are not allowed.
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
      message: Adding Linux capabilities is not allowed.
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        (!has(object.spec.hostPID) || !object.spec.hostPID) &&
        (!has(object.spec.hostIPC) || !object.spec.hostIPC)
      message: Sharing the host network, PID or IPC namespace is not allowed.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !has(v.hostPath) || (
            !v.hostPath.path.contains('..') &&
            !v.hostPath.path.contains('docker.sock') &&
            params.data.allowedHostPaths.split(',').exists(p,
              v.hostPath.path == p || v.hostPath.path.startsWith(p + '/'))))
      message: hostPath volumes must be under one of the allowedHostPaths and must not reference docker.sock.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: server-manager-pods
spec:
  policyName: server-manager-pods
  validationActions: ["Deny"]
  paramRef:
    name: server-manager-policy
    namespace: server-manager-workloads
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        server-manager/workloads: "true"
