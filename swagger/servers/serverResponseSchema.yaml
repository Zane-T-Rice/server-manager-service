required:
  - id
  - applicationName
  - containerName
  - isUpdatable
  - isInResponseChain
type: object
properties:
  id:
    type: string
    format: uuid
  applicationName:
    type: string
  containerName:
    type: string
  isUpdatable:
    type: boolean
  isInResponseChain:
    type: boolean
  hostId:
    type: string
    format: uuid
  status:
    type: string
    description: >-
      The state of the Server in the cluster: "running", or "starting" while it
      is not ready yet. "stopped" means it is not deployed and "unknown" means the
      cluster could not be asked.
