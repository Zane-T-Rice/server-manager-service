required:
  - id
  - applicationName
  - containerName
  - isUpdatable
  - ports
  - host
type: object
properties:
  id:
    type: string
    format: uuid
  applicationName:
    type: string
  containerName:
    type: string
  isUpdatable:
    type: boolean
  ports:
    type: array
    items:
      type: object
      properties:
        number:
          type: number
  host:
    type: object
    properties:
      name:
        type: string
  status:
    type: string
    description: >-
      The state of the Server in the cluster: "running", or "starting" while it
      is not ready yet. "stopped" means it is not deployed and "unknown" means the
      cluster could not be asked.
