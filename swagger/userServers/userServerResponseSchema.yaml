required:
  - id
  - applicationName
  - containerName
  - isUpdatable
  - ports
  - host
type: object
properties:
  id:
    type: string
    format: uuid
  applicationName:
    type: string
  containerName:
    type: string
  isUpdatable:
    type: boolean
  ports:
    type: array
    items:
      type: object
      properties:
        number:
          type: number
  host:
    type: object
    properties:
      url:
        type: string
  status:
    type: string
    description: >-
      Only present when getting all Servers. The state of the Server's container
      on its host, i.e. running, paused, restarting, exited or created. "stopped"
      means there is no container and "unknown" means the host could not be asked.
